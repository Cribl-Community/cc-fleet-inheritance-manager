# Product API access declaration for Fleet Inheritance Manager
# These are the Cribl API endpoints this app needs to read fleet, pack, and knowledge object data

policies:
  # Fleet/Group endpoints
  - object: '/products/stream/groups'
    actions: ['GET']
  - object: '/products/stream/groups/*'
    actions: ['GET']
  - object: '/products/edge/groups'
    actions: ['GET']
  - object: '/products/edge/groups/*'
    actions: ['GET']

  # Pack endpoints
  - object: '/packs'
    actions: ['GET', 'PUT', 'PATCH']
  - object: '/packs/*'
    actions: ['GET', 'PUT', 'PATCH']
  - object: '/packs/*/export'
    actions: ['GET']
  - object: '/m/:gid/packs'
    actions: ['GET', 'PUT', 'POST', 'PATCH'] # POST reinstalls a pack over an existing copy (force) when copying contents between fleets
  - object: '/m/:gid/packs/*'
    actions: ['GET', 'PUT', 'PATCH']
  - object: '/m/:gid/packs/*/export'
    actions: ['GET']

  # Commit and deploy published pack changes
  - object: '/version/status'
    actions: ['GET']
  - object: '/version/commit'
    actions: ['POST']
  - object: '/products/stream/groups/*/deploy'
    actions: ['PATCH']
  - object: '/products/edge/groups/*/deploy'
    actions: ['PATCH']
  - object: '/master/groups/*/deploy'
    actions: ['PATCH']

  # Knowledge objects within packs (PATCH to edit pipelines, routes, sources, destinations, and lookup rows; POST to add a pipeline, source, or destination a fleet is missing)
  - object: '/p/*'
    actions: ['GET', 'PATCH']
  - object: '/m/:gid/p/*'
    actions: ['GET', 'PATCH', 'POST']
