# Product API access declaration for Fleet Inheritance Manager
# These are the Cribl API endpoints this app needs to read fleet, pack, and knowledge object data

policies:
  # Fleet/Group endpoints
  - object: '/products/stream/groups'
    actions: ['GET']
  - object: '/products/stream/groups/*'
    actions: ['GET']
  - object: '/products/edge/groups'
    actions: ['GET']
  - object: '/products/edge/groups/*'
    actions: ['GET']

  # Pack endpoints
  - object: '/packs'
    actions: ['GET', 'PUT', 'PATCH']
  - object: '/packs/*'
    actions: ['GET', 'PUT', 'PATCH', 'DELETE']
  - object: '/packs/*/export'
    actions: ['GET']
  - object: '/m/:gid/packs'
    actions: ['GET', 'PUT', 'PATCH']
  - object: '/m/:gid/packs/*'
    actions: ['GET', 'PUT', 'PATCH', 'DELETE']
  - object: '/m/:gid/packs/*/export'
    actions: ['GET']

  # Knowledge objects within packs
  - object: '/p/*'
    actions: ['GET']
